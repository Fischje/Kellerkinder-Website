<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kellerkinder Gaming Logo</title>
  <desc id="desc">Neonfarbenes sechseckiges Emblem mit Kellerbogen, KK-Monogramm und Gaming-Symbolen.</desc>
  <defs>
    <linearGradient id="edge" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35e7ff"/>
      <stop offset="0.46" stop-color="#7766ff"/>
      <stop offset="1" stop-color="#ff4fc8"/>
    </linearGradient>
    <linearGradient id="face" x1="126" y1="96" x2="394" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151b35"/>
      <stop offset="0.55" stop-color="#090c18"/>
      <stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(256 260) rotate(90) scale(205)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172758" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#05060b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M256 25 449 137v238L256 487 63 375V137Z" fill="#05060b" stroke="url(#edge)" stroke-width="14" filter="url(#glow)"/>
  <path d="M256 48 428 148v216L256 464 84 364V148Z" fill="url(#face)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <path d="M256 48 428 148v216L256 464 84 364V148Z" fill="url(#core)"/>

  <!-- Kellerbogen und Treppen -->
  <path d="M157 294V207c0-59 44-107 99-107s99 48 99 107v87" fill="none" stroke="url(#edge)" stroke-width="16" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M187 291v-77c0-42 31-76 69-76s69 34 69 76v77" fill="#080b15" stroke="#7a83aa" stroke-opacity="0.5" stroke-width="5"/>
  <path d="M178 338h156M194 315h124M213 294h86" fill="none" stroke="#35e7ff" stroke-opacity="0.68" stroke-width="7" stroke-linecap="round"/>

  <!-- KK Monogramm -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" filter="url(#soft)">
    <path d="M178 181v93m0-42 53-50m-53 50 57 48" stroke="#35e7ff"/>
    <path d="M274 181v93m0-42 53-50m-53 50 57 48" stroke="#ff4fc8"/>
  </g>

  <!-- Gaming buttons -->
  <g transform="translate(256 374)">
    <rect x="-102" y="-31" width="204" height="75" rx="36" fill="#090c18" stroke="url(#edge)" stroke-width="7"/>
    <path d="M-62-5v27M-76 8h28" stroke="#35e7ff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="1" r="8" fill="#ff4fc8"/>
    <circle cx="75" cy="18" r="8" fill="#7766ff"/>
    <circle cx="28" cy="19" r="6" fill="#35e7ff"/>
  </g>

  <circle cx="113" cy="173" r="5" fill="#35e7ff" filter="url(#glow)"/>
  <circle cx="402" cy="322" r="5" fill="#ff4fc8" filter="url(#glow)"/>
  <circle cx="359" cy="109" r="4" fill="#7766ff" filter="url(#glow)"/>
</svg>
