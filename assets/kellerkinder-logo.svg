<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kellerkinder Gaming Logo</title>
  <desc id="desc">Sechseckiges Emblem in Graublau und Grün mit Kellerbogen, KK-Monogramm und Gaming-Symbolen.</desc>
  <!-- Farben wie die Seite (Design „NAVI“): Graublau #1b1f27, Grün #76e36c, Weiß -->
  <defs>
    <linearGradient id="edge" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6f5ae"/>
      <stop offset="0.5" stop-color="#76e36c"/>
      <stop offset="1" stop-color="#3fae36"/>
    </linearGradient>
    <linearGradient id="face" x1="126" y1="96" x2="394" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a303c"/>
      <stop offset="0.55" stop-color="#1e232c"/>
      <stop offset="1" stop-color="#15181f"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(256 260) rotate(90) scale(205)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76e36c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#15181f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path d="M256 25 449 137v238L256 487 63 375V137Z" fill="#15181f" stroke="url(#edge)" stroke-width="14" filter="url(#glow)"/>
  <path d="M256 48 428 148v216L256 464 84 364V148Z" fill="url(#face)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M256 48 428 148v216L256 464 84 364V148Z" fill="url(#core)"/>

  <!-- Kellerbogen und Treppen -->
  <path d="M157 294V207c0-59 44-107 99-107s99 48 99 107v87" fill="none" stroke="url(#edge)" stroke-width="16" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M187 291v-77c0-42 31-76 69-76s69 34 69 76v77" fill="#15181f" stroke="#8d97a8" stroke-opacity="0.45" stroke-width="5"/>
  <path d="M178 338h156M194 315h124M213 294h86" fill="none" stroke="#76e36c" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>

  <!-- KK Monogramm: weiß + grün wie der Schriftzug „KELLER“ + „KINDER“ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" filter="url(#soft)">
    <path d="M178 181v93m0-42 53-50m-53 50 57 48" stroke="#ffffff"/>
    <path d="M274 181v93m0-42 53-50m-53 50 57 48" stroke="#76e36c"/>
  </g>

  <!-- Gaming buttons -->
  <g transform="translate(256 374)">
    <rect x="-102" y="-31" width="204" height="75" rx="36" fill="#15181f" stroke="url(#edge)" stroke-width="7"/>
    <path d="M-62-5v27M-76 8h28" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="1" r="8" fill="#76e36c"/>
    <circle cx="75" cy="18" r="8" fill="#ffffff"/>
    <circle cx="28" cy="19" r="6" fill="#b6f5ae"/>
  </g>

  <circle cx="113" cy="173" r="5" fill="#76e36c" filter="url(#glow)"/>
  <circle cx="402" cy="322" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="359" cy="109" r="4" fill="#b6f5ae" filter="url(#glow)"/>
</svg>
